<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RODAR - Header BEM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Bloque principal: header | Modificador: header--sticky -->
  <header class="header header--sticky">
    <div class="header__container">
      
      <!-- Marca / Logo -->
      <a href="#" class="header__brand">
        <span class="header__logo">
          <svg class="header__logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="2.5"></circle>
            <line x1="12" y1="3" x2="12" y2="9.5"></line>
            <line x1="4.2" y1="16.5" x2="9.8" y2="13.2"></line>
            <line x1="19.8" y1="16.5" x2="14.2" y2="13.2"></line>
          </svg>
        </span>
        <span class="header__title">RODAR</span>
      </a>

      <!-- Navegación central -->
      <nav class="header__nav" aria-label="Navegación principal">
        <ul class="header__menu">
          <li class="header__item">
            <a href="#" class="header__link">Inicio</a>
          </li>
          <li class="header__item">
            <!-- Modificador de estado activo -->
            <a href="#" class="header__link header__link--active">Catálogo</a>
          </li>
          <li class="header__item">
            <a href="#" class="header__link">Comparar</a>
          </li>
          <li class="header__item">
            <a href="#" class="header__link">Marcas</a>
          </li>
          <li class="header__item">
            <a href="#" class="header__link">Tipos</a>
          </li>
          <li class="header__item">
            <a href="#" class="header__link">Eléctricos</a>
          </li>
        </ul>
      </nav>

      <!-- Acción derecha: Favoritos con contador -->
      <div class="header__actions">
        <button type="button" class="header__favorites" aria-label="Ver favoritos">
          <svg class="header__favorites-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="header__badge">2</span>
        </button>
      </div>

    </div>
  </header>

</body>
</html>
